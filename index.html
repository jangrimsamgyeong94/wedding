<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151311">
  <meta name="description" content="한국 웨딩 스튜디오에서 선별한 285개의 웨딩 촬영 포즈 레퍼런스">
  <title>POSE ATLAS — Wedding Direction Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#151311;--ink-2:#24201d;--paper:#f3efe8;--paper-2:#e8e0d5;--gold:#c89e63;--line:rgba(21,19,17,.13);--muted:#81786e;--ease:cubic-bezier(.2,.8,.2,1)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--ink);color:var(--ink);font-family:"Noto Sans KR",sans-serif;overflow:hidden}
    button,a{font:inherit}
    button{cursor:pointer}
    .shell{display:grid;grid-template-columns:minmax(390px,57vw) minmax(420px,43vw);height:100dvh}
    .stage{position:relative;min-height:0;background:radial-gradient(circle at 75% 20%,#3a3129 0,transparent 35%),linear-gradient(145deg,#191613,#0e0d0c 70%);color:#fff;overflow:hidden}
    .stage::before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E")}
    .brand{position:absolute;z-index:3;top:26px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.18em;text-transform:uppercase;font-size:11px}
    .brand strong{font-weight:600}
    .brand span{color:#c7bfb6}
    .hero-number{position:absolute;z-index:1;left:-12px;bottom:-66px;font:600 clamp(150px,22vw,340px)/.75 "Cormorant Garamond",serif;color:rgba(255,255,255,.035);letter-spacing:-.08em;user-select:none}
    .focus-wrap{position:absolute;inset:74px 62px 112px;display:grid;place-items:center}
    .focus-wrap::after{content:"";position:absolute;width:78%;height:60%;bottom:-5%;background:var(--gold);filter:blur(90px);opacity:.08}
    #focusImage{position:relative;z-index:2;display:block;max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 30px 90px rgba(0,0,0,.44);transition:opacity .18s ease,transform .6s var(--ease)}
    #focusImage.changing{opacity:.25;transform:scale(.985)}
    .focus-meta{position:absolute;z-index:3;left:30px;right:30px;bottom:24px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end}
    .eyebrow{display:flex;align-items:center;gap:11px;color:#d4c4b0;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
    .eyebrow::before{content:"";width:28px;height:1px;background:var(--gold)}
    .focus-title{margin:6px 0 0;font:500 clamp(30px,4vw,58px)/.9 "Cormorant Garamond",serif;letter-spacing:-.025em}
    .focus-source{display:inline-flex;margin-top:11px;color:#a9a19a;text-decoration:none;font-size:11px;letter-spacing:.08em}
    .focus-source:hover{color:#fff}
    .controls{display:flex;gap:8px}
    .icon-btn{width:42px;height:42px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(255,255,255,.04);color:#fff;display:grid;place-items:center;transition:.25s var(--ease)}
    .icon-btn:hover{background:#fff;color:#171411;transform:translateY(-2px)}
    .gallery-pane{min-width:0;background:var(--paper);height:100dvh;overflow:auto;scrollbar-width:thin;scrollbar-color:#aa9c8c transparent}
    .gallery-head{position:sticky;z-index:10;top:0;padding:24px 25px 16px;background:linear-gradient(var(--paper) 78%,rgba(243,239,232,.88));backdrop-filter:blur(14px)}
    .intro{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:17px}
    .intro h1{margin:0;font:600 clamp(28px,3vw,45px)/.9 "Cormorant Garamond",serif;letter-spacing:-.025em}
    .intro p{margin:0;color:var(--muted);font-size:10px;line-height:1.55;text-align:right}
    .tabs{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:100px;padding:4px;background:rgba(255,255,255,.38)}
    .tab{border:0;border-radius:100px;background:transparent;color:#756d65;padding:10px 7px;font-size:11px;white-space:nowrap;transition:.25s var(--ease)}
    .tab span{margin-left:4px;opacity:.52}
    .tab.active{color:#fff;background:var(--ink);box-shadow:0 7px 18px rgba(21,19,17,.18)}
    .grid{padding:5px 25px 50px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
    .card{position:relative;border:0;padding:0;overflow:hidden;background:#ded7cd;aspect-ratio:var(--ratio,4/5);min-height:128px;isolation:isolate;animation:enter .45s var(--ease) both}
    .card[hidden]{display:none}
    .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .55s var(--ease),filter .35s}
    .card::after{content:"";position:absolute;inset:auto 0 0;height:48%;background:linear-gradient(transparent,rgba(0,0,0,.66));opacity:0;transition:.25s}
    .card:hover img,.card.active img{transform:scale(1.045)}
    .card.active{outline:2px solid var(--gold);outline-offset:2px}
    .card:hover::after,.card.active::after{opacity:1}
    .card-meta{position:absolute;z-index:2;left:9px;right:9px;bottom:8px;color:#fff;display:flex;justify-content:space-between;align-items:end;gap:5px;opacity:0;transform:translateY(6px);transition:.25s}
    .card:hover .card-meta,.card.active .card-meta{opacity:1;transform:none}
    .card-meta b{font-size:9px;font-weight:500;letter-spacing:.08em}
    .card-meta i{font:500 17px/1 "Cormorant Garamond",serif}
    .empty{display:none;padding:90px 20px;text-align:center;color:var(--muted)}
    .footer{padding:20px 25px 32px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.65}
    dialog{padding:0;border:0;background:transparent;max-width:none;max-height:none;width:100vw;height:100dvh}
    dialog::backdrop{background:rgba(7,6,5,.96);backdrop-filter:blur(16px)}
    .lightbox{width:100%;height:100%;display:grid;place-items:center;padding:55px;position:relative}
    .lightbox img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 25px 90px #000}
    .lightbox-close{position:absolute;top:20px;right:24px}
    .lightbox-label{position:absolute;left:25px;bottom:20px;color:#ddd;font-size:11px;letter-spacing:.12em}
    @keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media(max-width:980px){
      body{overflow:auto;background:var(--paper)}.shell{display:block;height:auto}.stage{height:72dvh;min-height:560px}.focus-wrap{inset:68px 28px 120px}.gallery-pane{height:auto;overflow:visible}.gallery-head{top:0}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}
    }
    @media(max-width:650px){
      .stage{height:66dvh;min-height:500px}.brand{top:20px;left:18px;right:18px}.brand span{display:none}.focus-wrap{inset:62px 18px 128px}.focus-meta{left:18px;right:18px;bottom:20px}.focus-title{font-size:38px}.controls .icon-btn:nth-child(-n+2){display:none}.gallery-head{padding:17px 14px 12px}.intro p{display:none}.tabs{overflow-x:auto;display:flex}.tab{min-width:max-content;flex:1;padding-inline:15px}.grid{padding:3px 14px 36px;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.card{min-height:180px}.lightbox{padding:50px 12px}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="stage" aria-label="선택한 포즈 크게 보기">
      <div class="brand"><strong>Pose Atlas / 2026</strong><span>Korean Wedding Studios · Curated 285</span></div>
      <div class="hero-number" id="heroNumber">001</div>
      <div class="focus-wrap"><img id="focusImage" alt="선택한 웨딩 포즈" decoding="async"></div>
      <div class="focus-meta">
        <div>
          <div class="eyebrow"><span id="focusCategory">함께</span><span id="focusCount">001 / 285</span></div>
          <h2 class="focus-title" id="focusTitle">Wedding Direction</h2>
          <a class="focus-source" id="focusSource" target="_blank" rel="noopener">출처 보기 ↗</a>
        </div>
        <div class="controls">
          <button class="icon-btn" id="prevBtn" aria-label="이전 포즈">←</button>
          <button class="icon-btn" id="nextBtn" aria-label="다음 포즈">→</button>
          <button class="icon-btn" id="fullBtn" aria-label="전체 화면">↗</button>
        </div>
      </div>
    </section>

    <section class="gallery-pane" id="galleryPane" aria-label="포즈 갤러리">
      <header class="gallery-head">
        <div class="intro">
          <h1>Wedding<br><i>Direction Book</i></h1>
          <p>원하는 포즈를 눌러 크게 보세요.<br>방향키로 이동하면 썸네일도 따라갑니다.</p>
        </div>
        <nav class="tabs" aria-label="포즈 카테고리">
          <button class="tab active" data-filter="all">전체 <span>285</span></button>
          <button class="tab" data-filter="male">남자 솔로 <span>36</span></button>
          <button class="tab" data-filter="female">여자 솔로 <span>57</span></button>
          <button class="tab" data-filter="couple">함께 <span>152</span></button>
          <button class="tab" data-filter="outdoor">야외 <span>40</span></button>
        </nav>
      </header>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty">이 카테고리에 표시할 사진이 없습니다.</div>
      <footer class="footer">사진은 촬영 포즈 참고를 위한 큐레이션이며 저작권은 각 스튜디오와 원작자에게 있습니다. 사진을 선택하면 해당 인스타그램 계정으로 이동할 수 있습니다.</footer>
    </section>
  </main>

  <dialog id="lightbox">
    <div class="lightbox">
      <img id="lightboxImage" alt="웨딩 포즈 전체 화면">
      <button class="icon-btn lightbox-close" id="closeBtn" aria-label="닫기">×</button>
      <div class="lightbox-label" id="lightboxLabel"></div>
    </div>
  </dialog>

        card.style.animationDelay=`${Math.min(index,18)*18}ms`;
        card.setAttribute('aria-label',`${item.categoryLabel} ${String(index+1).padStart(3,'0')} 크게 보기`);
        card.innerHTML=`<img src="${item.src}" alt="${item.categoryLabel} 웨딩 포즈 · ${item.studio}" loading="lazy" decoding="async"><span class="card-meta"><b>${item.categoryLabel}</b><i>${String(index+1).padStart(3,'0')}</i></span>`;
        card.addEventListener('click',()=>selectItem(item)); fragment.appendChild(card);
      }); grid.appendChild(fragment);
    }

    function selectItem(item,scrollFocus=false){
      state.current=Math.max(0,state.visible.findIndex(candidate=>candidate.id===item.id));
      focusImage.classList.add('changing');
      const preload=new Image(); preload.src=item.src;
      preload.onload=()=>{focusImage.src=item.src;focusImage.classList.remove('changing')};
      focusImage.alt=`${item.categoryLabel} 웨딩 포즈 · ${item.studio}`;
      focusCategory.textContent=item.categoryLabel;
      focusCount.textContent=`${String(state.current+1).padStart(3,'0')} / ${String(state.visible.length).padStart(3,'0')}`;
      focusTitle.textContent=item.studio;
      focusSource.href=item.source; focusSource.textContent=`@${item.account} · Instagram ↗`;
      heroNumber.textContent=String(item.id).padStart(3,'0');
      document.querySelectorAll('.card.active').forEach(card=>card.classList.remove('active'));
      const card=document.querySelector(`.card[data-index="${items.indexOf(item)}"]`); if(card)card.classList.add('active');
      if(scrollFocus&&innerWidth<=980)document.querySelector('.stage').scrollIntoView({behavior:'smooth'});
    }

    function applyFilter(filter){
      state.filter=filter;state.visible=filter==='all'?items:items.filter(item=>item.category===filter);state.current=0;
      document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.filter===filter));
      document.querySelectorAll('.card').forEach(card=>card.hidden=filter!=='all'&&card.dataset.category!==filter);
      document.querySelector('#empty').style.display=state.visible.length?'none':'block';
      if(state.visible.length)selectItem(state.visible[0]);pane.scrollTo({top:0,behavior:'smooth'});
    }

    function step(direction,followCard=false){
      if(!state.visible.length)return;
      const next=Math.max(0,Math.min(state.visible.length-1,state.current+direction));
      if(next===state.current)return;
      state.current=next;selectItem(state.visible[state.current]);
      if(followCard){
        const item=state.visible[state.current];
        const card=document.querySelector(`.card[data-index="${items.indexOf(item)}"]`);
        card?.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});
      }
    }
    function gridColumns(){
      const template=getComputedStyle(grid).gridTemplateColumns;
      return Math.max(1,template.split(' ').filter(Boolean).length);
    }
    function openLightbox(){const item=state.visible[state.current];if(!item)return;lightboxImage.src=item.src;lightboxLabel.textContent=`${item.categoryLabel} · @${item.account}`;lightbox.showModal();}

    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>applyFilter(tab.dataset.filter)));
    document.querySelector('#prevBtn').addEventListener('click',()=>step(-1));
    document.querySelector('#nextBtn').addEventListener('click',()=>step(1));
    document.querySelector('#fullBtn').addEventListener('click',openLightbox);
    focusImage.addEventListener('click',openLightbox);
    document.querySelector('#closeBtn').addEventListener('click',()=>lightbox.close());
    lightbox.addEventListener('click',event=>{if(event.target===lightbox)lightbox.close()});
    addEventListener('keydown',event=>{
      const moves={ArrowLeft:-1,ArrowRight:1,ArrowUp:-gridColumns(),ArrowDown:gridColumns()};
      if(event.key in moves){event.preventDefault();step(moves[event.key],true)}
      if(event.key==='1')applyFilter('male');if(event.key==='2')applyFilter('female');if(event.key==='3')applyFilter('couple');if(event.key==='4')applyFilter('outdoor');
    });

    renderCards();applyFilter('all');
  </script>
</body>
</html>
